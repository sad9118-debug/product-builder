<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기</title>
    <link rel="stylesheet" href="style.css">
    <meta name="google-adsense-account" content="ca-pub-3269592078237192">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3269592078237192"
     crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index_ko.html">저녁 메뉴 추천</a>
            </div>
            <div class="nav-links">
                <a href="contact_ko.html">문의</a>
                <div class="language-switcher">
                    <a href="contact.html">English</a>
                </div>
                <div class="theme-switcher">
                    <input type="checkbox" id="theme-toggle">
                    <label for="theme-toggle"></label>
                </div>
            </div>
        </nav>
    </header>
    <div class="container">
        <h1>문의하기</h1>
        <p class="intro">
            질문, 피드백 또는 제휴 문의가 있으신가요?
            아래 양식을 작성하여 저희에게 연락해주세요.
        </p>
        <form action="https://formspree.io/f/xdazlwoe" method="POST" class="contact-form">
            <label for="name">이름:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">메시지:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">보내기</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2026 저녁 메뉴 추천. 모든 권리 보유.</p>
    </footer>
    <script src="main_ko.js"></script>
</body>
</html>
