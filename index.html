<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국의 숨은 명곡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>한국의 숨은 명곡</h1>
            <p>시대를 선택하고 숨겨진 보석 같은 노래를 발견하세요.</p>
        </header>
        <div class="era-buttons">
            <button class="era-btn" data-era="1970">1970년대</button>
            <button class="era-btn" data-era="1980">1980년대</button>
            <button class="era-btn" data-era="1990">1990년대</button>
        </div>
        <div id="song-recommendation" class="song-card hidden">
            <h2 id="song-title"></h2>
            <p id="song-artist"></p>
            <div class="youtube-player">
                <iframe id="youtube-iframe" width="560" height="315" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <p id="song-description"></p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
