    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/iRFfOy1i3/";

        let model, labelContainer, maxPredictions;
        const fileInput = document.getElementById('file-input');
        const previewImage = document.getElementById('preview-image');
        const predictButton = document.getElementById('predict-button');

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function predict() {
            if (previewImage.src && previewImage.style.display !== 'none') {
                const prediction = await model.predict(previewImage);
                for (let i = 0; i < maxPredictions; i++) {
                    const classPrediction =
                        prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                    labelContainer.childNodes[i].innerHTML = classPrediction;
                }
            } else {
                labelContainer.innerHTML = 'Please upload an image first.';
            }
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.style.display = 'block';
                    predictButton.style.display = 'block';
                    labelContainer.innerHTML = ''; // Clear previous predictions
                };
                reader.readAsDataURL(file);
            } else {
                previewImage.style.display = 'none';
                predictButton.style.display = 'none';
                labelContainer.innerHTML = '';
            }
        });

        predictButton.addEventListener('click', predict);

        // Load the model when the page loads
        init();

        // Theme switching logic (copied from main.js)
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        function switchTheme(e) {
            if (e.target.checked) {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        }

        themeToggle.addEventListener('change', switchTheme);

        const currentTheme = localStorage.getItem('theme');

        if (currentTheme) {
            html.setAttribute('data-theme', currentTheme);

            if (currentTheme === 'dark') {
                themeToggle.checked = true;
            }
        }
    </script>
